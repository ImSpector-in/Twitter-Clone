name: Daily Bots

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [cto_fanatic, ux_critic, buildinpublic]
    steps:
      - name: Post tweet for ${{ matrix.bot }}
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/post-bots" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"bot":"${{ matrix.bot }}"}' \
            --fail-with-body

  reply:
    runs-on: ubuntu-latest
    needs: post
    strategy:
      fail-fast: false
      matrix:
        bot: [cto_fanatic, ux_critic, buildinpublic]
    steps:
      - name: Reply to a tweet for ${{ matrix.bot }}
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/bot-replies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"bot":"${{ matrix.bot }}"}' \
            --fail-with-body

  respond-to-notifications:
    runs-on: ubuntu-latest
    needs: reply
    strategy:
      fail-fast: false
      matrix:
        bot: [cto_fanatic, ux_critic, buildinpublic]
    steps:
      - name: Respond to notifications for ${{ matrix.bot }}
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/bot-notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"bot":"${{ matrix.bot }}"}' \
            --fail-with-body
